name: SmartCut

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"

options:
  bundleIdPrefix: dev.jamesqquick
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      ENABLE_HARDENED_RUNTIME: "NO"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGNING_ALLOWED: "YES"
      ENABLE_HARDENED_RUNTIME: "YES"

targets:
  SmartCut:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SmartCut
        excludes:
          - "Info.plist"
          - "SmartCut.entitlements"
    dependencies:
      - package: Sparkle
        product: Sparkle
    resources:
      - path: SmartCut/Assets.xcassets
    info:
      path: SmartCut/Info.plist
      properties:
        CFBundleName: SmartCut
        CFBundleDisplayName: SmartCut
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # Sparkle auto-update feed URL (stable raw GitHub URL, updated by CI each release).
        SUFeedURL: https://raw.githubusercontent.com/jamesqquick/SmartCut/main/docs/appcast.xml
        # EdDSA public key for update signature verification.
        # Generate with: ./bin/generate_keys (from a Sparkle release tarball).
        # Store the private key as SPARKLE_PRIVATE_KEY in GitHub Actions secrets.
        SUPublicEDKey: PkWoESqIh2Qu4y0cyLiQ4nHeJBeFRdBEfdib64AhRWw=
        # Allow drag-and-drop of media files of any type the user picks.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.movie
              - public.video
              - com.apple.quicktime-movie
              - public.mpeg-4
    entitlements:
      path: SmartCut/SmartCut.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamesqquick.smartcut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: ""
    # preBuildScripts removed: the Node sidecar is no longer bundled.
    # The pipeline now runs natively in Swift (see Engine/ folder).
