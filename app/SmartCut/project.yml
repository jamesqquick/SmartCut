name: SmartCut
options:
  bundleIdPrefix: dev.jamesqquick
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      ENABLE_HARDENED_RUNTIME: "NO"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGNING_ALLOWED: "YES"
      ENABLE_HARDENED_RUNTIME: "YES"

targets:
  SmartCut:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SmartCut
        excludes:
          - "Info.plist"
          - "SmartCut.entitlements"
    resources:
      - path: SmartCut/Assets.xcassets
    info:
      path: SmartCut/Info.plist
      properties:
        CFBundleName: SmartCut
        CFBundleDisplayName: SmartCut
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # Allow drag-and-drop of media files of any type the user picks.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.movie
              - public.video
              - com.apple.quicktime-movie
              - public.mpeg-4
    entitlements:
      path: SmartCut/SmartCut.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamesqquick.smartcut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: ""
    preBuildScripts:
      # Build the Node sidecar and copy the self-contained server.cjs into the
      # app bundle's Resources so SmartCut.app is portable (no workspace path
      # dependency at runtime). Resolved at launch via Bundle.main.
      - name: Bundle quietcut-server sidecar
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          REPO_ROOT="$SRCROOT/../.."
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          SIDECAR="$REPO_ROOT/packages/quietcut-server/dist/server.cjs"

          # Rebuild the sidecar when pnpm is on PATH; otherwise fall back to an
          # existing bundle (e.g. CI that built it in a prior step).
          if command -v pnpm >/dev/null 2>&1; then
            ( cd "$REPO_ROOT" && pnpm --filter quietcut-server build )
          fi

          if [ ! -f "$SIDECAR" ]; then
            echo "error: quietcut-server bundle missing at $SIDECAR — run 'pnpm --filter quietcut-server build'." >&2
            exit 1
          fi

          DEST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DEST"
          cp "$SIDECAR" "$DEST/server.cjs"
