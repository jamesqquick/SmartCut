name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # Pin to Xcode 26.3 — the project uses objectVersion 77 (generated by Xcode 26.x).
        # macos-15 defaults to Xcode 16.4 which cannot read format 77.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript workspace
        # Build all packages in dependency order (core → cli/server).
        # quietcut-server depends on quietcut-core's dist output, so a full
        # workspace build is required rather than filtering to server alone.
        run: pnpm build

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: app/SmartCut

      # --- Code signing ---

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Preserve login.keychain-db in the search list alongside the new one.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # --- Build and export ---

      - name: Archive
        run: |
          xcodebuild archive \
            -project app/SmartCut/SmartCut.xcodeproj \
            -scheme SmartCut \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SmartCut.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            ENABLE_HARDENED_RUNTIME=YES

      - name: Export archive
        run: |
          # Substitute the team ID into ExportOptions.plist — xcodebuild does not
          # expand $(VAR) syntax in plist files passed to -exportArchive.
          sed "s/\$(APPLE_TEAM_ID)/${{ secrets.APPLE_TEAM_ID }}/g" \
            app/SmartCut/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SmartCut.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # --- Notarization ---

      - name: Set up App Store Connect API key
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$AC_API_KEY_BASE64" | base64 --decode \
            -o "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.AC_API_KEY_ID }}.p8"

      - name: Notarize app
        run: |
          # notarytool requires a zip, pkg, or dmg — not a raw .app bundle.
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/export/SmartCut.app" \
            "$RUNNER_TEMP/SmartCut.app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/SmartCut.app.zip" \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.AC_API_KEY_ID }}.p8" \
            --key-id "${{ secrets.AC_API_KEY_ID }}" \
            --issuer "${{ secrets.AC_API_ISSUER_ID }}" \
            --wait \
            --timeout 20m

      - name: Staple notarization ticket
        run: xcrun stapler staple "$RUNNER_TEMP/export/SmartCut.app"

      # --- DMG packaging ---

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: |
          bash scripts/package-dmg.sh \
            "$RUNNER_TEMP/export/SmartCut.app" \
            "$RUNNER_TEMP/SmartCut.dmg" \
            "${{ steps.version.outputs.VERSION }}"

      - name: Sign DMG
        run: |
          codesign --force --sign "Developer ID Application" \
            "$RUNNER_TEMP/SmartCut.dmg"

      - name: Notarize DMG
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/SmartCut.dmg" \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.AC_API_KEY_ID }}.p8" \
            --key-id "${{ secrets.AC_API_KEY_ID }}" \
            --issuer "${{ secrets.AC_API_ISSUER_ID }}" \
            --wait \
            --timeout 10m

      - name: Staple DMG
        run: xcrun stapler staple "$RUNNER_TEMP/SmartCut.dmg"

      # --- Sparkle update artifact ---

      - name: Install Sparkle tools
        # Fetch the latest Sparkle release dynamically so CI stays current
        # without manual version bumps.  Adds bin/ (sign_update, generate_appcast)
        # to PATH for the signing step below.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SPARKLE_VER=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/sparkle-project/Sparkle/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" \
            -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle-tools
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools
          echo "/tmp/sparkle-tools/bin" >> "$GITHUB_PATH"

      - name: Create Sparkle update zip (post-staple)
        # The SmartCut.app.zip created earlier (for notarytool) was built
        # BEFORE xcrun stapler staple, so it lacks the staple ticket.
        # Re-zip the stapled .app so Gatekeeper accepts the update.
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/export/SmartCut.app" \
            "$RUNNER_TEMP/SmartCut-update.zip"

      - name: Sign update zip with EdDSA key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Sparkle 2.x: write the base64 key to a temp file and pass via
          # --ed-key-file. The -s flag is deprecated and exits 1 in recent builds.
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          SIGN_OUT=$(sign_update --ed-key-file /tmp/sparkle_key "$RUNNER_TEMP/SmartCut-update.zip")
          rm -f /tmp/sparkle_key
          ED_SIG=$(echo "$SIGN_OUT" | grep -oE 'edSignature="[^"]+"' | cut -d'"' -f2)
          FILE_SIZE=$(wc -c < "$RUNNER_TEMP/SmartCut-update.zip" | tr -d ' ')
          echo "ED_SIG=$ED_SIG"       >> "$GITHUB_ENV"
          echo "FILE_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"

      - name: Update appcast.xml
        run: |
          BUILD=$(python3 -c "import plistlib; \
            p = plistlib.load(open('app/SmartCut/SmartCut/Info.plist', 'rb')); \
            print(p['CFBundleVersion'])")
          python3 scripts/update-appcast.py \
            --version   "${{ steps.version.outputs.VERSION }}" \
            --build     "$BUILD" \
            --signature "$ED_SIG" \
            --length    "$FILE_SIZE" \
            --appcast   docs/appcast.xml

      - name: Commit updated appcast
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "chore: update appcast for v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main

      # --- Publish ---

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SmartCut ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/SmartCut.dmg
            ${{ runner.temp }}/SmartCut-update.zip
